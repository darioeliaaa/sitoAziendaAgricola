<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sfondo Verde Oliva Elegante con bordi arrotondati -->
  <rect width="100" height="100" rx="25" fill="#2C392F"/>
  
  <!-- Foglia d'ulivo color Oro -->
  <path d="M50,32 C50,15 75,15 75,15 C75,15 75,35 50,32 Z" fill="#C2A878"/>
  
  <!-- Goccia d'olio color Oro -->
  <path d="M50,32 C50,32 30,55 30,68 A20,20 0 0,0 70,68 C70,55 50,32 50,32 Z" fill="#C2A878"/>
  
  <!-- Piccolo riflesso di luce sulla goccia (dettaglio premium) -->
  <path d="M40,65 A8,8 0 0,1 42,55" fill="none" stroke="#FDFCF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
